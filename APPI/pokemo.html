<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemones </title>
  <link rel="stylesheet" href="pokemon.css">
</head>
<body>
  <h1>Pokemones </h1>
  <ul id="pokemones"></ul>
  <button id="carga">Cargar Pokédex</button>

  <script>
  document.getElementById('carga').addEventListener('click', async () => {
    try {
      
      let response = await fetch('https://pokeapi.co/api/v2/pokemon?offset=300&limit=20');
      let data = await response.json();
      let lista = document.getElementById('pokemones');
      lista.innerHTML = '';

      for (let poke of data.results) {
        let res = await fetch(poke.url);
        let info = await res.json();

       
        let li = document.createElement('li');
        li.innerHTML = `
          <img src="${info.sprites.front_default}" class="pokemon-img" alt="${info.name}">
          <div class="pokemon-name">${info.name}</div>
          <div class="pokemon-info">
            <p><strong>ID:</strong> ${info.id}</p>
            <p><strong>Altura:</strong> ${info.height}</p>
            <p><strong>Peso:</strong> ${info.weight}</p>
            <p><strong>Tipo:</strong> ${info.types.map(t => t.type.name).join(', ')}</p>
            <p><strong>Habilidades:</strong> ${info.abilities.map(a => a.ability.name).join(', ')}</p>
            <p><strong>Defensa:</strong> ${info.stats[2].base_stat}</p>
          </div>
        `;
        lista.appendChild(li);
      }
    } catch (error) {
      console.error('Error al cargar los Pokémon', error);
    }
  });
  </script>
</body>
</html>
