<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de apis</title>
</head>
<body>
    <h1>Lista de contactos</h1>
    <button id="cargar">ver contactos</button>
    <ul id="lista"></ul>
    <script>
        document.getElementById('cargar').addEventListener('click', async () => { 
        
            try {
                let response = await fetch('https://jsonplaceholder.typicode.com/users');
                let users = await response.json();
                let lista = document.getElementById('lista');
                lista.innerHTML = ''; 

                users.forEach(user => {
                    let li = document.createElement('li');
                    li.textContent = Nombre: ${user.name} - teléfono: ${user.phone};
                    li.textContent += ` - email: ${user.email}`;
                    li.textContent += ` - web: ${user.website}`;
                    li.textContent += dirreccion = ` - dirección: ${user.address.street}, ${user.address.suite}, ${user.address.city}, ${user.address.zipcode}`;
                    lista.appendChild(li);
                    
                });
            } catch (error) {
                console.error('Error al cargar los contactos:', error);
            }
        });
    </script>
</body>
</html>
